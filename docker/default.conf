# Cache policy, chosen by URI so a single add_header at server level applies to
# everything. (Per-location add_header would silently drop the security headers
# inherited from the server block.)
map $uri $app_cache_control {
    # Hashless shell files: always revalidate, so a new build reaches phones.
    default                  "no-cache";
    # Icons never change without a new filename.
    ~^/icons/                "public, max-age=604800";
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # nginx's stock mime.types predates this one.
    types {
        application/manifest+json  webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip              on;
    gzip_vary         on;
    # nginx defaults to level 1, which leaves schedule.json at 7.8 KB; 6 gets it
    # to 5.6 KB for a negligible amount of CPU on files this small.
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml;

    add_header Cache-Control        $app_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy      "same-origin" always;
    # Everything comes from here. The one inline script is the theme replay in
    # index.html's <head>, allowed by its hash: edit that script and this hash
    # has to change with it (tools/test/app.test.mjs fails until it does).
    # Inline styles stay allowed: the status card's progress bar sets its width,
    # and «Δικά σου» writes its colours onto <html>. Pointing REMOTE_SCHEDULE_URL
    # at another host means adding it as connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aQCEngyARmrfyvVWEO33rsHdUpHRQVdbpmdR6y5Ctik='; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options      DENY always;

    # Serving under a subpath: /programma must not 404 without its slash.
    absolute_redirect off;

    # The app has no routes of its own, so a path that is not a file is a 404.
    # Answering every one with index.html turned a misnamed schedule.json into
    # «not valid JSON» and an iPhone's icon request into a page of HTML.
    location / {
        try_files $uri $uri/ =404;
    }

    # Asked for at the root whatever the page links to: iOS for its home-screen
    # icon, browsers for a tab icon.
    location = /apple-touch-icon.png             { try_files /icons/apple-touch-icon.png =404; }
    location = /apple-touch-icon-precomposed.png { try_files /icons/apple-touch-icon.png =404; }
    location = /favicon.ico                      { try_files /icons/favicon-32.png =404; }

    # The converter's working files have no business being served.
    location = /data/report.txt { return 404; }
    location /tools/           { return 404; }

    access_log off;
}
