services:
  programma:
    image: giorgospap777/school-program:latest
    container_name: programma
    restart: unless-stopped
    # Behind a reverse proxy that terminates TLS. The service worker needs
    # HTTPS, so do not expose this port to students directly.
    ports:
      - "127.0.0.1:8080:80"
    # Publish a new schedule without rebuilding:
    # volumes:
    #   - ./data/schedule.json:/usr/share/nginx/html/data/schedule.json:ro
